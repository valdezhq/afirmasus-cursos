<section id="courses-section" class="courses-section">
  <h2 class="courses-heading">{{ 'courses.heading' | translate }}</h2>

  <div class="courses-container">
    <div nz-row [nzGutter]="[16, 16]">

      <!-- Card 1: Direitos -->
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8">
        <nz-card [nzBordered]="true" nzHoverable class="course-card" [nzBodyStyle]="{'padding': '16px'}">
          <div class="card-content">
            <h3>{{ 'courses.direitos.name' | translate }}</h3>
            <a href="https://www.escolavirtual.gov.br/curso/950" target="_blank" rel="noopener noreferrer">
              <img
                ngSrc="assets/courses/direitos.png"
                alt="{{ 'courses.direitos.imgAlt' | translate }}"
                width="496"
                height="284" />
            </a>
          </div>
        </nz-card>
      </div>

      <!-- Card 2: Letramento -->
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8">
        <nz-card [nzBordered]="true" nzHoverable class="course-card" [nzBodyStyle]="{'padding': '16px'}">
          <div class="card-content">
            <h3>{{ 'courses.letramento.name' | translate }}</h3>
            <a href="https://mooc.ifgoiano.edu.br/enrol/index.php?id=493" target="_blank" rel="noopener noreferrer">
              <img
                ngSrc="assets/courses/letramento.jpeg"
                alt="{{ 'courses.letramento.imgAlt' | translate }}"
                width="496"
                height="284" />
            </a>
          </div>
        </nz-card>
      </div>

      <!-- Card 3: PNSI -->
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8">
        <nz-card [nzBordered]="true" nzHoverable class="course-card" [nzBodyStyle]="{'padding': '16px'}">
          <div class="card-content">
            <h3>{{ 'courses.pnsi.name' | translate }}</h3>
            <a href="https://www.unasus.gov.br/cursos/curso/35988" target="_blank" rel="noopener noreferrer">
              <img
                ngSrc="assets/courses/pnsi.jpg"
                alt="{{ 'courses.pnsi.imgAlt' | translate }}"
                width="496"
                height="284" />
            </a>
          </div>
        </nz-card>
      </div>

      <!-- Card 4: Acesso -->
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8">
        <nz-card [nzBordered]="true" nzHoverable class="course-card" [nzBodyStyle]="{'padding': '16px'}">
          <div class="card-content">
            <h3>{{ 'courses.acesso.name' | translate }}</h3>
            <a href="https://www.unasus.gov.br/cursos/curso/47094" target="_blank" rel="noopener noreferrer">
              <img
                ngSrc="assets/courses/acesso.jpg"
                alt="{{ 'courses.acesso.imgAlt' | translate }}"
                width="496"
                height="284" />
            </a>
          </div>
        </nz-card>
      </div>

      <!-- Card 5: Saúde -->
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8">
        <nz-card [nzBordered]="true" nzHoverable class="course-card" [nzBodyStyle]="{'padding': '16px'}">
          <div class="card-content">
            <h3>{{ 'courses.saude.name' | translate }}</h3>
            <a href="https://www.escolavirtual.gov.br/curso/1201" target="_blank" rel="noopener noreferrer">
              <img
                ngSrc="assets/courses/saude.jpg"
                alt="{{ 'courses.saude.imgAlt' | translate }}"
                width="496"
                height="284" />
            </a>
          </div>
        </nz-card>
      </div>

    </div>
  </div>
</section>
